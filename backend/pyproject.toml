[project]
name = "backend"
version = "0.1.0"
description = "Economist Agent backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.2",
  "celery>=5.4.0",
  "redis>=5.0.8",
  "python-dotenv>=1.0.1",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "pymupdf>=1.24.10",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12.3",
  "langchain-openai>=0.2.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
dev = "app.cli:dev"
serve = "app.cli:serve"
worker = "app.cli:worker"
lint = "app.cli:lint"
format = "app.cli:format_code"
typecheck = "app.cli:typecheck"
test = "app.cli:test"
rebuild-db = "app.cli:rebuild_db"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests", "alembic"]
extend-exclude = ["references", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
